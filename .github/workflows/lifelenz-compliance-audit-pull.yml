name: LifeLenz Compliance Audit Pull

# New Data Explorer Compliance Audit report (Lakehouse-backed, async) -- real labor-compliance
# violations (meal/rest break, minor-labor-law, etc.) with a $ cost / hours penalty per violation.
# No Playwright needed -- same direct-token-only precedent as LifeLenz Schedule Variance Pull /
# LifeLenz Attendance Pull (LIFELENZ_TOKEN already works for every other LifeLenz GraphQL/REST
# call; see scripts/lifelenz-compliance-audit-pull.mjs's own header for why a browser fallback
# isn't duplicated here yet).

on:
  schedule:
    # 10:05 UTC — same slot family as the other daily LifeLenz pulls, offset 5 min so the two
    # Data Explorer pulls don't both start triggering 27 async reports at the exact same minute.
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Rolling window size in days (default: 14)'
        required: false
        default: '14'
      debug:
        description: 'Verbose per-store logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run LifeLenz compliance audit pull
        run: node scripts/lifelenz-compliance-audit-pull.mjs
        env:
          LIFELENZ_TOKEN:                           ${{ secrets.LIFELENZ_TOKEN }}
          VITE_SUPABASE_URL:                         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:                 ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIFELENZ_COMPLIANCE_AUDIT_WINDOW_DAYS:     ${{ github.event.inputs.window_days || '14' }}
          LIFELENZ_DEBUG:                            ${{ github.event.inputs.debug || '0' }}
