name: QSRSoft Store Settings Pull

# memory/project-qsrsoft-store-settings-endpoint.md — per-store cash-handling config (drawer/safe/
# instore), inventory settings (yield groups, waste limits), homepage-metric thresholds, and store
# hours/dayparts. A CONFIG object, not a metric — one request per store, pulled weekly since config
# changes rarely, same cadence as the sibling Store Controls pull.

on:
  schedule:
    - cron: '15 13 * * 1'   # Mondays 13:15 UTC — 15 min after Store Controls' own Monday 13:00 slot
  workflow_dispatch:
    inputs:
      stores:
        description: 'Subset of NSNs (comma-separated, default: all 27)'
        required: false
        default: ''
      busn_date:
        description: 'Override store_busn_dt (YYYY-MM-DD, default: today UTC)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Pull QSRSoft Store Settings
        run: node scripts/qsrsoft-store-settings-pull.mjs
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_EBOS_TOKEN:        ${{ secrets.QSRSOFT_EBOS_TOKEN }}
          QSRSOFT_USERNAME:          ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:          ${{ secrets.QSRSOFT_PASSWORD }}
          SETTINGS_STORES:           ${{ github.event.inputs.stores || '' }}
          STORESET_BUSN_DATE:        ${{ github.event.inputs.busn_date || '' }}
          QSRSOFT_DEBUG:             ${{ github.event.inputs.debug || '0' }}
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-settings-pull-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
