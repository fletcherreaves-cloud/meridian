# CI — run the test suite and the production build on every pull request.
#
# WHY THIS EXISTS: until 2026-08-11 nothing in this repo ran `npm test`. The only
# automated check was `npm run build` inside deploy.yml, which triggers on push to main
# — i.e. AFTER a merge. So 1197 tests existed and were executed only when a human
# remembered to, and a PR could be merged red.
#
# That gap had already cost something concrete: on 2026-08-10 a merge resolution
# resurrected a deleted component and 1165 tests passed while the build failed with 7
# duplicate-export errors (memory/feedback-verification-in-sandbox.md). Both checks are
# here for that reason — the suite and the build catch different classes of breakage and
# neither substitutes for the other.
#
# Runs on pull_request (the gate that matters) and on push to main (so a direct push or
# a bad merge commit is still caught). deploy.yml is left alone; it owns deployment, this
# owns verification.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the previous run — don't burn minutes on stale commits.
# Never cancel on main: those runs are the record of whether a merged commit was green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Dispatch #60: 1ca02ee broke main for seven commits on a clean local 1952/1952 because
      # Intl.DateTimeFormat's hourCycle resolution for hour12:false is ICU/Node-version-dependent
      # -- identical on the sandbox's Node 22 and CI's (then-)Node 20, but only after the fix.
      # A single pinned Node version only catches divergence FROM that one version; running both
      # the sandbox's Node (22) and the historical CI pin (20) catches the whole class, not just
      # this instance. See memory/dispatch-60-ci-node-parity.md.
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Dispatch #79 -- setup-node resolves the matrix's floating major (20/22) to a specific
      # patch version, and that patch/ICU version is exactly what caused dispatch #60's incident
      # (Intl.DateTimeFormat hourCycle resolution differing between Node versions). Printing it
      # explicitly means a future divergence is visible in the log itself, not something you have
      # to dig into the setup-node step's own output to confirm.
      - name: Node version
        run: node -v
      - run: npm ci

      # Suite first: it is ~11s and its failures are far more legible than a build error.
      - name: Test
        run: npm test

      # Build second. It catches what the suite structurally cannot — duplicate exports,
      # unresolved imports, anything that only surfaces when the module graph is linked.
      # Env vars mirror deploy.yml so this build matches the one that actually ships.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
