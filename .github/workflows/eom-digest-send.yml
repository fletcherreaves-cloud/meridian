name: EOM Digest Send (roll-up email)

# Dispatch #215 Task 3 — rolls per-store EOM count-completion + FOB(+target) data up to
# District / Patch and emails ONE digest per (level, group) via scripts/eom-digest-send.mjs.
#
# CADENCE (dispatch #217 — levels + send hour are now configurable, org_config key
# 'eom_digest_config', settable from the EOM Digest modal's "⚙️ Scheduled send" row): this
# workflow now runs HOURLY, and scripts/eom-digest-send.mjs itself self-gates on whether the
# CURRENT UTC hour matches the configured `sendHourUtc` (default 23 = 6pm CT, #215's original
# hardcoded value) — the same "cron is just a landing point, the script does the real
# filtering" pattern already used for inCountWindow() below. Running hourly instead of once
# daily is what makes a *configured* hour meaningful without editing this YAML every time
# someone changes the setting in the UI; 23 of 24 hourly runs simply no-op via the new hour
# gate, matching how scripts/qsrsoft-onhand-pull.mjs already self-gates on its own count-window
# check rather than relying on cron granularity alone.
on:
  schedule:
    - cron: '0 * * * *'   # hourly — eom-digest-send.mjs's own hour-gate (org_config 'eom_digest_config'.sendHourUtc) decides which run actually sends; inCountWindow() still gates the count-window too
  workflow_dispatch:
    inputs:
      level:
        description: 'Which level(s) to send: district, patch, org, all, or blank for the default (district + patch)'
        required: false
        default: ''
      force:
        description: 'Send even outside the active count window (1 = on) — used by the on-demand "Generate Report" panel action'
        required: false
        default: '1'
      period:
        description: 'Override period (YYYY-MM, default: current month)'
        required: false
        default: ''
      date:
        description: 'Override the business date queried (YYYY-MM-DD, default: today UTC)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

# Queue, don't cancel — every write this script does (Resend sends) is a side effect, not a DB
# write, but a cancelled mid-send run could plausibly send a partial set of the (level, group)
# emails and never finish the rest; queuing avoids that half-sent state. Matches
# qsrsoft-onhand-pull.yml's own reasoning for the same choice.
concurrency:
  group: eom-digest-send-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send EOM roll-up digest
        run: node scripts/eom-digest-send.mjs
        env:
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIGEST_LEVEL:              ${{ github.event.inputs.level  || '' }}
          DIGEST_FORCE:              ${{ github.event.inputs.force  || '0' }}
          DIGEST_PERIOD:             ${{ github.event.inputs.period || '' }}
          DIGEST_DATE:               ${{ github.event.inputs.date   || '' }}
          QSRSOFT_DEBUG:             ${{ github.event.inputs.debug  || '0' }}
