name: QSRSoft Shift Manager Pull

on:
  schedule:
    # 12:15 UTC = ~7:15 AM CDT — refreshes the current month's per-manager attributed
    # performance. Upsert on (loc, period_month, geid), so re-running keeps MTD current.
    # (start_date/end_date below are workflow_dispatch-only — the scheduled run never sets
    # them, so it always targets the monthly table, never shift_manager_range.)
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'Month to pull (YYYY-MM). Default: current month (UTC). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Explicit range start (YYYY-MM-DD). Writes to shift_manager_range, not the monthly table. Set alone for a single day.'
        required: false
        default: ''
      end_date:
        description: 'Explicit range end (YYYY-MM-DD). Defaults to start_date (single day) if start_date is set and this is blank.'
        required: false
        default: ''
      stores:
        description: 'Subset of NSNs, comma-separated. Default: all 27.'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Pull QSRSoft Shift Manager Summary
        run: node scripts/qsrsoft-shift-manager-pull.mjs
        env:
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_TOKEN:              ${{ secrets.QSRSOFT_TOKEN }}
          QSRSOFT_COGNITO_TOKEN:      ${{ secrets.QSRSOFT_COGNITO_TOKEN }}
          QSRSOFT_USERNAME:           ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:           ${{ secrets.QSRSOFT_PASSWORD }}
          SHIFTMGR_PERIOD:            ${{ github.event.inputs.period     || '' }}
          SHIFTMGR_START:             ${{ github.event.inputs.start_date || '' }}
          SHIFTMGR_END:               ${{ github.event.inputs.end_date   || '' }}
          ROSTER_STORES:              ${{ github.event.inputs.stores || '' }}
          QSRSOFT_DEBUG:              ${{ github.event.inputs.debug  || '0' }}
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-manager-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
