# Sync Failure Watch
#
# WHY THIS EXISTS: on 2026-08-11 the LifeLenz Daily Sync was found to have been failing
# every day since 2026-08-06 — six consecutive days of stale labor/scheduling data — and
# nothing surfaced it. It was noticed only because someone happened to open the Actions
# tab. At that point 24 scheduled workflows existed and NOT ONE had any failure handling.
#
# This watcher is one file covering all of them, rather than 24 edits. It listens for
# workflow_run completions and keeps exactly one open GitHub issue per failing workflow:
#
#   • first failure           → opens an issue labelled `sync-failure`
#   • continued failure       → comments on the SAME issue, at most once per 12h
#   • the workflow succeeds   → closes the issue with a recovery note
#
# The 12h comment throttle matters: several watched workflows run hourly (On-Hand, Live
# Pulse, SAGE), so an unthrottled watcher would post dozens of comments a day and get
# muted — which is the failure mode this is meant to prevent, reproduced.
#
# NOTE: `workflow_run` only fires for workflows on the DEFAULT branch. All watched
# workflows run on main, so that is fine — but a new sync workflow will not be watched
# until it is merged to main AND added to the list below. The list is explicit on
# purpose: exploratory/one-off workflows (lifelenz-vlh-explore, fob-riddle-analysis,
# recount-forensics-scan, deploy) are deliberately NOT watched.
#
# This does not replace per-stream freshness checking in the app, and the two layers catch
# different failures: a workflow can complete with conclusion=success and still write nothing
# (a token that silently degrades mid-run, a query that legitimately returns zero rows), which
# this watcher's workflow_run listener has no way to see — it only fires on completed runs, so
# a run that never completes (a queued job on an offline self-hosted runner, see dispatch #65)
# is invisible to it too. That "ran clean, wrote nothing" gap is exactly what src/engine/
# stream-freshness.js's per-stream STREAMS check (#171, dispatch15/dispatch #163) is for —
# it reads the data itself, independent of whether the workflow that should have produced it
# reported success. At-A-Glance's freshness check used to pool every feed into one Math.max
# (so one dead feed stayed invisible while any other was current); that pooling bug is fixed —
# see stream-freshness.js and CLAUDE.md's "Adding a new automated pull" rule, item 2.
#
# PUSH NOTIFICATION (added 2026-11-01, see memory/proactive-sync-notifications.md): a silent
# GitHub issue is not proactive — it only surfaces to someone who happens to open the repo. The
# owner found the QSRSoft McDelivery Pull failure from a manual screenshot, not from this
# watcher, despite McDelivery already being on the list below. So on a workflow's FIRST failure
# this now also sends an immediate email + SMS (same Resend API / AT&T email-to-SMS gateway as
# scripts/lib/resend-notify.mjs's existing EOM-count notifications — reused directly inline here
# since this job has no checkout/npm step to import that .mjs from). Continued-failure comments
# (already throttled to 1/12h above) also send an email, but no repeat SMS — stay informed
# without spamming the phone for something already known to be down. Recovery sends email only.

name: Sync Failure Watch

on:
  workflow_run:
    workflows:
      - Data Completeness Check
      - EOM Baseline Snapshot
      - EOM Digest Send (roll-up email)
      - Event Impact — Retail Lift Measurement
      - Event Impact — Weather Lift Measurement
      - Forecast Week Precompute
      - Hourly Projection Accuracy
      - LifeLenz Attendance Pull
      - LifeLenz Daily Sync
      - LifeLenz People Skills Sync
      - Local News RSS Pull
      - QSRSoft Historical Backfill
      - QSRSoft Cash Anomaly Check
      - QSRSoft Daily Activity Pull
      - QSRSoft Digital App Pull
      - QSRSoft Email Report Parse
      - QSRSoft Employee Roster Pull
      - QSRSoft FOB Pull
      - QSRSoft Forms Completion Pull
      - QSRSoft Forms Reviews Pull
      - QSRSoft Inventory Summary Pull
      - QSRSoft KB Analyze
      - QSRSoft KB Pull
      - QSRSoft Live Pulse Capture
      - QSRSoft McDelivery Pull
      - QSRSoft Menu Item Activity Pull
      - QSRSoft Menu Items Catalog Pull
      - QSRSoft Menu Item Recipe Pull
      - QSRSoft Menu Price Comparison Pull
      - QSRSoft On-Hand Pull (EOM count-progress)
      - QSRSoft Operations Report Pull
      - QSRSoft Product Mix Pull
      - QSRSoft Product Outage Pull
      - QSRSoft Punch Times Pull
      - QSRSoft Quarter-Hour Sales Pull
      - QSRSoft Register Audit Pull
      - QSRSoft Roster Statistics Pull
      - QSRSoft Security Events Pull
      - QSRSoft Shift Manager Pull
      - QSRSoft Store Controls Pull
      - QSRSoft Store Settings Pull
      - QSRSoft Turnover Pull
      - QSRSoft Variance Pull (EOM diagnosis data)
      - QSRSoft eBOS Purchases Pull
      - SAGE Scheduled Prompts
      - Scheduled-Run Reliability Watchdog
      - Security Rules Run
      - Weekly Cycle Digest Send (roll-up email)
      - YouTube Mentions Pull
    types: [completed]

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Skip cancelled runs entirely — a cancellation is a human action, not a fault.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Open, update, or close the sync-failure issue
        uses: actions/github-script@v7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          script: |
            // Mirrors scripts/lib/resend-notify.mjs's postResend()/EMAIL_TO/SMS_TO exactly —
            // duplicated inline rather than imported because this job has no checkout/npm step
            // (keeping it that way on purpose: this watcher fires on every one of ~45 workflows'
            // completions, so adding checkout+npm ci here would multiply CI minutes for no
            // benefit over 3 small helper functions). If resend-notify.mjs's constants ever
            // change, update both places.
            const RESEND_URL  = 'https://api.resend.com/emails';
            const RESEND_FROM = 'Meridian <onboarding@resend.dev>';
            const EMAIL_TO    = 'fletcher.reaves@mcreaves.com';
            const SMS_TO      = '3346722598@txt.att.net'; // AT&T email-to-SMS gateway
            async function postResend({ to, subject, html, text }) {
              const apiKey = process.env.RESEND_API_KEY;
              if (!apiKey) { core.warning('[notify] RESEND_API_KEY not set — skipping send to ' + to); return false; }
              const payload = { from: RESEND_FROM, to: [to], subject };
              if (html) payload.html = html; else payload.text = text;
              try {
                const resp = await fetch(RESEND_URL, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload),
                });
                if (!resp.ok) { core.warning(`[notify] Resend API returned ${resp.status} for ${to}`); return false; }
                return true;
              } catch (e) { core.warning(`[notify] Resend send to ${to} threw: ${e.message}`); return false; }
            }

            const run       = context.payload.workflow_run;
            const wfName    = run.name;
            const failed    = run.conclusion === 'failure';
            const title     = `🔴 Sync failure: ${wfName}`;
            const LABEL     = 'sync-failure';
            const THROTTLE_H = 12;

            // Make sure the label exists — createIssue fails on an unknown label.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo, name: LABEL, color: 'b60205',
                description: 'A scheduled data-sync workflow is failing',
              }).catch(() => {});   // harmless race if two runs finish together
            }

            // Find the open issue for THIS workflow, if any.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find(i => i.title === title);

            const runLink = `[run #${run.run_number}](${run.html_url})`;
            const footer  = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            if (failed) {
              if (!existing) {
                const created = await github.rest.issues.create({
                  ...context.repo,
                  title,
                  labels: [LABEL],
                  body:
                    `**${wfName}** failed.\n\n` +
                    `- First failure: ${runLink} (\`${run.head_sha.slice(0,7)}\`)\n` +
                    `- Started: ${run.run_started_at}\n\n` +
                    `This issue closes itself automatically when the workflow next succeeds. ` +
                    `Further failures are added as comments, at most one per ${THROTTLE_H}h.\n\n` +
                    `**Check first:** an expired API token is the usual cause for the ` +
                    `LifeLenz and QSRSoft pulls — see \`memory/lifelenz-session.md\` for the ` +
                    `refresh runbook. Read the job log before assuming that, though: on ` +
                    `2026-08-11 the token was only half the story and the browser-login ` +
                    `fallback had also stopped working.` + footer,
                });
                core.notice(`Opened sync-failure issue for ${wfName}`);
                const issueUrl = created.data.html_url;
                const subject = `🔴 Meridian sync failure: ${wfName}`;
                const html = `<div style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:560px">` +
                  `<p><strong>${wfName}</strong> just failed its scheduled run.</p>` +
                  `<p><a href="${run.html_url}">Job log</a> · <a href="${issueUrl}">Tracking issue</a></p>` +
                  `<p style="color:#555">Started: ${run.run_started_at}</p></div>`;
                const smsBody = `Meridian: ${wfName} FAILED. ${run.html_url}`;
                await postResend({ to: EMAIL_TO, subject, html });
                await postResend({ to: SMS_TO, subject: 'Meridian', text: smsBody.length > 300 ? smsBody.slice(0, 297) + '...' : smsBody });
                return;
              }
              // Throttle: only comment if nothing has been added recently.
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: existing.number, per_page: 100,
              });
              const last = comments.length
                ? new Date(comments[comments.length - 1].created_at)
                : new Date(existing.created_at);
              const hoursSince = (Date.now() - last.getTime()) / 3.6e6;
              if (hoursSince < THROTTLE_H) {
                core.notice(`Throttled (${hoursSince.toFixed(1)}h < ${THROTTLE_H}h) for ${wfName}`);
                return;
              }
              const daysDown = ((Date.now() - new Date(existing.created_at).getTime()) / 8.64e7).toFixed(1);
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Still failing — ${runLink}. **${daysDown} days** since the first failure.` + footer,
              });
              core.notice(`Commented on #${existing.number} for ${wfName}`);
              // Email only on the throttled continued-failure path — no repeat SMS for
              // something already known to be down.
              await postResend({
                to: EMAIL_TO,
                subject: `🔴 Meridian sync still failing: ${wfName} (${daysDown}d)`,
                html: `<div style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:560px">` +
                  `<p><strong>${wfName}</strong> is still failing — <strong>${daysDown} days</strong> since the first failure.</p>` +
                  `<p><a href="${run.html_url}">Latest job log</a> · <a href="${existing.html_url}">Tracking issue</a></p></div>`,
              });
              return;
            }

            // Success path — close any open failure issue for this workflow.
            if (existing) {
              const daysDown = ((Date.now() - new Date(existing.created_at).getTime()) / 8.64e7).toFixed(1);
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body:
                  `✅ Recovered — ${runLink} succeeded after **${daysDown} days**.\n\n` +
                  `A green run means the workflow completed, **not** that it wrote rows. ` +
                  `If this was a long outage, check the job log for the actual upsert counts ` +
                  `and confirm the backfill covered the gap.` + footer,
              });
              await postResend({
                to: EMAIL_TO,
                subject: `✅ Meridian sync recovered: ${wfName}`,
                html: `<div style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:560px">` +
                  `<p><strong>${wfName}</strong> recovered — <a href="${run.html_url}">run #${run.run_number}</a> succeeded after <strong>${daysDown} days</strong>.</p>` +
                  `<p style="color:#555">A green run means it completed, not that it wrote rows — check the job log if this was a long outage.</p></div>`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
              core.notice(`Closed #${existing.number} — ${wfName} recovered`);
            }
