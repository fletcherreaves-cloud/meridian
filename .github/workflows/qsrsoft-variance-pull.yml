name: QSRSoft Variance Pull (EOM diagnosis data)

# Pulls the food-cost diagnosis inputs (Variance Stat + Yields, Waste, Transfers)
# for all 27 stores into Supabase so the EOM Dashboard + diagnosis engine are
# cloud-fresh on every device. Daily during the month; the EOM count/diagnosis
# window is when it matters most, but daily keeps the current-period picture live
# for weekly Raw-Items monitoring too. Manual runs can target any period.

on:
  schedule:
    - cron: '30 10 * * *'   # 10:30 UTC daily (after the other 10:00 pulls land)
  workflow_dispatch:
    inputs:
      period:
        description: 'Period to pull (YYYY-MM, default: current month)'
        required: false
        default: ''
      stores:
        description: 'Subset of NSNs (comma-separated, default: all 27)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Pull QSRSoft Variance / Waste / Transfers
        run: node scripts/qsrsoft-variance-pull.mjs
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_EBOS_TOKEN:        ${{ secrets.QSRSOFT_EBOS_TOKEN }}
          QSRSOFT_COGNITO_TOKEN:     ${{ secrets.QSRSOFT_COGNITO_TOKEN }}
          QSRSOFT_TOKEN:             ${{ secrets.QSRSOFT_TOKEN }}
          QSRSOFT_USERNAME:          ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:          ${{ secrets.QSRSOFT_PASSWORD }}
          VARIANCE_PERIOD:           ${{ github.event.inputs.period || '' }}
          VARIANCE_STORES:           ${{ github.event.inputs.stores || '' }}
          QSRSOFT_DEBUG:             ${{ github.event.inputs.debug  || '0' }}
