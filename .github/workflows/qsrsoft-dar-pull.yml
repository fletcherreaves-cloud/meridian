name: QSRSoft Daily Activity Pull

on:
  schedule:
    # Times are anchored to US Central. GitHub cron is fixed UTC and does NOT
    # observe DST, so these land ~1h earlier (Central) during winter (CST).
    # 08:00 UTC = ~3:00 AM CDT / 2:00 AM CST — pre-dawn catch-up: re-pulls the last
    # few days after overnight POS batches finalize, filling any store whose prior
    # day was incomplete at the 5 AM run.
    - cron: '0 8 * * *'
    # 10:00 UTC = 5:00 AM CDT — previous day is fully closed by then (morning batch)
    - cron: '0 10 * * *'
    # Intraday current-day refreshes, every 15 min through the operating day (owner
    # request 2026-11-08, re: Shift Scoreboard freshness — memory/plan-shift-scoreboard-
    # 2026-11-07.md). qsr_daily_activity upserts on (loc,dt,hour_slot), so more frequent
    # runs refresh today's existing rows rather than add new ones — no row-count growth.
    # Covers ~7:00 AM-6:45 PM CDT; continued below for the evening span (UTC date rolls).
    - cron: '*/15 12-23 * * *'
    # Same 15-min cadence, continuing ~7:00 PM-10:45 PM CDT.
    - cron: '*/15 0-3 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Max days of history on initial run (default: 90)'
        required: false
        default: '90'
      days_recent:
        description: 'Rolling re-pull window in days — overwrites current + past N days (default: 4)'
        required: false
        default: '4'
      force_full:
        description: 'Force full days_back pull, ignoring existing data (1 = on)'
        required: false
        default: '0'
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Set with end_date to pull an explicit window in chunks (e.g. one quarter).'
        required: false
        default: ''
      end_date:
        description: 'Backfill end (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

# External heartbeat (2026-11-11, memory/finding-github-schedule-unreliable-external-
# heartbeat-2026-11-11.md) dispatches this workflow via workflow_dispatch on the same
# cadence as the schedule above, from outside GitHub's own cron queue — so a run from
# one trigger can land while the other's run is still in flight. Queue rather than
# overlap; the pull itself is idempotent (upsert on loc,dt,hour_slot) either way.
concurrency:
  group: qsrsoft-dar-pull-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # Raised so a large explicit backfill window (a quarter or more) can finish in
    # one run; the daily rolling pull still finishes in a few minutes.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            npx playwright install chromium --with-deps && break
            echo "playwright install attempt $i failed, retrying in 15s..." >&2
            sleep 15
          done

      - name: Pull QSRSoft Daily Activity data
        run: node scripts/qsrsoft-dar-pull.mjs
        env:
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_TOKEN:              ${{ secrets.QSRSOFT_TOKEN }}
          QSRSOFT_USERNAME:           ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:           ${{ secrets.QSRSOFT_PASSWORD }}
          QSRSOFT_DAR_DAYS_BACK:      ${{ github.event.inputs.days_back   || '90' }}
          # The two 15-min intraday schedules only need today — narrowing them to
          # days_recent=1 keeps each run fast and considerate of QSRSoft's API; the two
          # once-daily catch-up schedules above keep the full 4-day rolling window.
          QSRSOFT_DAR_DAYS_RECENT:    ${{ github.event.inputs.days_recent || (contains(fromJSON('["*/15 12-23 * * *","*/15 0-3 * * *"]'), github.event.schedule) && '1' || '4') }}
          QSRSOFT_DAR_FORCE_FULL:     ${{ github.event.inputs.force_full  || '0'  }}
          QSRSOFT_DAR_START_DATE:     ${{ github.event.inputs.start_date  || ''   }}
          QSRSOFT_DAR_END_DATE:       ${{ github.event.inputs.end_date    || ''   }}
          QSRSOFT_DAR_DEBUG:          ${{ github.event.inputs.debug       || '0'  }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
