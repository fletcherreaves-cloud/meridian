name: QSRSoft Register Audit Pull

# Dispatch #35: endpoint confirmed (dispatch #34's live capture) and implemented — cron enabled
# per the dispatch's own checklist item. NOT live-verified from the engineer session that wrote
# this (no QSRSoft credentials/network access there) — mapRow()'s field derivations are unit-
# tested against realistic fixture data (src/__tests__/register-audit-pull.test.js) but not
# against a real response. Before trusting the first scheduled run's output for anything
# personnel-sensitive, run this once via workflow_dispatch and spot-check a handful of resulting
# audit_rows entries against dispatch #34's own captured window (2026-08-12 → 2026-08-18, store
# 3708 and others) — see memory/dispatch35-register-audit-implementation.md.

on:
  schedule:
    # 10:00 UTC — matches the DAR/eBOS cadence (5:00 AM CDT, previous business day fully closed).
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Max days of history on initial run (default: 90)'
        required: false
        default: '90'
      days_recent:
        description: 'Rolling re-pull window in days (default: 4)'
        required: false
        default: '4'
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Set with end_date to pull an explicit window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Pull QSRSoft Register Audit data
        run: node scripts/qsrsoft-register-audit-pull.mjs
        env:
          VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_USERNAME:            ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:            ${{ secrets.QSRSOFT_PASSWORD }}
          QSRSOFT_AUDIT_DAYS_BACK:     ${{ github.event.inputs.days_back   || '90' }}
          QSRSOFT_AUDIT_DAYS_RECENT:   ${{ github.event.inputs.days_recent || '4'  }}
          QSRSOFT_AUDIT_START_DATE:    ${{ github.event.inputs.start_date  || ''   }}
          QSRSOFT_AUDIT_END_DATE:      ${{ github.event.inputs.end_date    || ''   }}
          QSRSOFT_AUDIT_DEBUG:         ${{ github.event.inputs.debug       || '0'  }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-audit-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
