name: QSRSoft Quarter-Hour Sales Pull

on:
  schedule:
    # US Central-anchored (GitHub cron is fixed UTC, no DST).
    # 10:00 UTC = ~5:00 AM CDT — previous day fully closed, feeds Record Hour's
    # confirmed (non-provisional) all-time records.
    - cron: '0 10 * * *'
    # 19:00 UTC = ~2:00 PM CDT — current-day refresh, so today's (provisional) reading
    # isn't hours stale while the business day is still open.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Max days of history on initial run (default: 90)'
        required: false
        default: '90'
      days_recent:
        description: 'Rolling re-pull window in days (default: 4)'
        required: false
        default: '4'
      force_full:
        description: 'Force full days_back pull, ignoring existing data (1 = on)'
        required: false
        default: '0'
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Set with end_date for an explicit window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Pull QSRSoft quarter-hour sales data
        run: node scripts/qsrsoft-sales-quarter-hour-pull.mjs
        env:
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_USERNAME:           ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:           ${{ secrets.QSRSOFT_PASSWORD }}
          QSRSOFT_QTRHR_DAYS_BACK:    ${{ github.event.inputs.days_back   || '90' }}
          QSRSOFT_QTRHR_DAYS_RECENT:  ${{ github.event.inputs.days_recent || '4'  }}
          QSRSOFT_QTRHR_FORCE_FULL:   ${{ github.event.inputs.force_full  || '0'  }}
          QSRSOFT_QTRHR_START_DATE:   ${{ github.event.inputs.start_date  || ''   }}
          QSRSOFT_QTRHR_END_DATE:     ${{ github.event.inputs.end_date    || ''   }}
          QSRSOFT_QTRHR_DEBUG:        ${{ github.event.inputs.debug       || '0'  }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtrhr-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
