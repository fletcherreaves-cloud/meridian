name: LifeLenz Schedule Variance Pull

# New Data Explorer Schedule Variance report (Lakehouse-backed, async) -- per-edit schedule-change
# audit trail: who edited a published schedule, what changed, and the hours/cost impact.
# No Playwright needed -- same direct-token-only precedent as LifeLenz Attendance Pull
# (LIFELENZ_TOKEN already works for every other LifeLenz GraphQL/REST call; see
# scripts/lifelenz-schedule-variance-pull.mjs's own header for why a browser fallback isn't
# duplicated here yet).

on:
  schedule:
    # 10:00 UTC = 5:00 AM CDT — same slot as the other daily LifeLenz/QSRSoft pulls
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Rolling window size in days (default: 14)'
        required: false
        default: '14'
      debug:
        description: 'Verbose per-store logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run LifeLenz schedule variance pull
        run: node scripts/lifelenz-schedule-variance-pull.mjs
        env:
          LIFELENZ_TOKEN:                           ${{ secrets.LIFELENZ_TOKEN }}
          VITE_SUPABASE_URL:                         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:                 ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIFELENZ_SCHEDULE_VARIANCE_WINDOW_DAYS:    ${{ github.event.inputs.window_days || '14' }}
          LIFELENZ_DEBUG:                            ${{ github.event.inputs.debug || '0' }}
