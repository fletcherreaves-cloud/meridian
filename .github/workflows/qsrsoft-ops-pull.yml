name: QSRSoft Operations Report Pull

on:
  schedule:
    # US Central-anchored (GitHub cron is fixed UTC, no DST). The Operations Report
    # finalizes overnight, so a morning pull captures the prior full day + LY.
    - cron: '0 10 * * *'   # ~5:00 AM CDT — previous day fully closed
    # Intraday current-day refreshes, every 15 min through the operating day (owner
    # request 2026-11-08 — cash-integrity/T-Red freshness: qsr_cash_sheet is already
    # the primary auto source for tRedAPct/tRedBPct/drawerOpens, src/engine/metric-
    # source.js's opsCashRows chain, not the emailed Glimpse/cash-sheet tables — so
    # this is the actual fix, not a new API to find). Upserts on (loc,dt), so more
    # frequent runs refresh today's rows rather than add new ones. Covers ~7:00
    # AM-6:45 PM CDT; continued below for the evening span (UTC date rolls).
    - cron: '*/15 12-23 * * *'
    # Same 15-min cadence, continuing ~7:00 PM-10:45 PM CDT. Supersedes the old
    # standalone ~2:00 PM CDT current-day-refresh run, which this block now covers.
    - cron: '*/15 0-3 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Max days of history on initial run (default: 45)'
        required: false
        default: '45'
      days_recent:
        description: 'Rolling re-pull window in days (default: 14, a full biweekly payroll period)'
        required: false
        default: '14'
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Set with end_date for an explicit window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

# External heartbeat (2026-11-11, memory/finding-github-schedule-unreliable-external-
# heartbeat-2026-11-11.md) dispatches this workflow via workflow_dispatch on the same
# cadence as the schedule above, from outside GitHub's own cron queue — so a run from
# one trigger can land while the other's run is still in flight. Queue rather than
# overlap; the pull itself is idempotent (upsert on loc,dt) either way.
concurrency:
  group: qsrsoft-ops-pull-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            npx playwright install chromium --with-deps && break
            echo "playwright install attempt $i failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: Pull QSRSoft Operations Report data
        run: node scripts/qsrsoft-ops-pull.mjs
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_USERNAME:          ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:          ${{ secrets.QSRSOFT_PASSWORD }}
          QSRSOFT_OPS_DAYS_BACK:     ${{ github.event.inputs.days_back   || '45' }}
          # The two 15-min intraday schedules only need today — narrowing them to
          # days_recent=1 keeps each run fast and considerate of QSRSoft's API; the
          # once-daily catch-up schedule above keeps the full 14-day rolling window.
          QSRSOFT_OPS_DAYS_RECENT:   ${{ github.event.inputs.days_recent || (contains(fromJSON('["*/15 12-23 * * *","*/15 0-3 * * *"]'), github.event.schedule) && '1' || '14') }}
          QSRSOFT_OPS_START_DATE:    ${{ github.event.inputs.start_date  || ''   }}
          QSRSOFT_OPS_END_DATE:      ${{ github.event.inputs.end_date    || ''   }}
          QSRSOFT_OPS_DEBUG:         ${{ github.event.inputs.debug       || '0'  }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
