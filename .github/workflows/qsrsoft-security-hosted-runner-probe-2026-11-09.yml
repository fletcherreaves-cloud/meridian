name: QSRSoft Security — Hosted Runner Probe (2026-11-09)

# One-off, read-only test. The months-long api.security.myqsrsoft.com AUTH_FAILED:403
# investigation (memory/finding-qsrsoft-security-entitlement-request-2026-08-22.md,
# memory/finding-failed-pull-email-audit-2026-10-06.md, dispatches #63/#83/#91/#95) always
# assumed network origin pointed TOWARD the owner's own Mac mini (every historical 200 came
# from there) -- hence every probe, including qsrsoft-security-token-identity-probe.yml, is
# pinned [self-hosted, macOS, qsr-security].
#
# 2026-11-09: that assumption flipped. A live session run (no self-hosted runner, a cloud
# sandbox) got 40/40 real 200s across stores/dates/event_tokens using a freshly-reset
# QSRSOFT_PASSWORD. The self-hosted runner, using the SAME credential (owner confirmed the
# secret was updated and re-verified it matches), still failed AUTH_FAILED:403 on the same
# unit shape, same code, same moment. The script's own identityFp() hash (sha256 of
# sub+cognito:username, never the raw claims) came back BYTE-IDENTICAL between the two runs --
# same Cognito principal, same credential, same code, only the network origin differs.
#
# This probe tests the one untested leg of that: does api.security.myqsrsoft.com even work
# from a GitHub-HOSTED runner (ubuntu-latest), or only from non-Mac-mini networks in general
# (consistent with the self-hosted Mac mini's own network having become the one that's now
# blocked -- e.g. an anomaly/rate-limit block accumulated from months of its own repeated
# automated 403s hitting a security-sensitive module). Read-only: no Supabase writes, no
# QSRSOFT_PASSWORD rotation, scoped to ONE store/date/event_token.
#
# Delete this workflow file once the question is answered either way -- it is not meant to be
# a permanent fixture (see memory/finding-qsrsoft-security-entitlement-request-2026-08-22.md
# for the full writeup once this result lands there).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: One real event_details call from a hosted runner
        run: |
          node -e '
            process.env.QSRSOFT_USERNAME = process.env.QSRSOFT_USERNAME;
            process.env.QSRSOFT_PASSWORD = process.env.QSRSOFT_PASSWORD;
            import("./scripts/lib/qsrsoft-auth.mjs").then(async ({ getFreshToken }) => {
              const { createHash } = await import("node:crypto");
              const token = await getFreshToken();
              const c = JSON.parse(Buffer.from(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"), "base64").toString("utf8"));
              const fp = createHash("sha256").update(`${c.sub||""}|${c["cognito:username"]||""}`).digest("hex").slice(0,12);
              console.log("IDENTITY", fp, "(compare against the self-hosted runner run)");
              const { fetchOne } = await import("./scripts/qsrsoft-security-events-pull.mjs");
              const r = await fetchOne("35242", "all_promo", "2026-11-08", token);
              console.log("STATUS", r.status, "| ROWS", Array.isArray(r.json) ? r.json.length : r.json, "| errHdr", r.diagHdrs);
            });
          '
        env:
          QSRSOFT_USERNAME: ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD: ${{ secrets.QSRSOFT_PASSWORD }}
