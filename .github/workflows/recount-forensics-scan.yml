name: Recount Forensics Scan

# On-demand district scan for implausible same-manager offsetting recount batches (padding detection).
# Read-only. No schedule — run when investigating.

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Period YYYY-MM (default: current month)'
        required: false
        default: ''
      min_swing:
        description: 'Minimum $ swing to consider (default 150)'
        required: false
        default: '150'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scan
        run: node scripts/recount-forensics-scan.mjs
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PERIOD:                    ${{ github.event.inputs.period }}
          MIN_SWING:                 ${{ github.event.inputs.min_swing }}
