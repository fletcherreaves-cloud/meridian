name: QSRSoft Security Events Pull

# Dispatch #83 REBUILD. Dispatch #81's premise (api.security.myqsrsoft.com fingerprints the
# TLS/HTTP-2 client, so only an in-browser page.evaluate() fetch could reach it) is OVERTURNED --
# see memory/finding-api-security-transport-fingerprint-2026-08-23.md's correction banner. A
# plain curl from the owner's Mac, full browser header set + a fresh token, returned 200 and 23
# real rows; the in-browser fetch is the one that actually fails (216/216 CORS-blocked). The pull
# script now makes a plain Node fetch() per unit, same shape as every other reporting-API pull --
# no Chromium, no SPA login, no page.evaluate(), no screenshots.
#
# Still runs on a SELF-HOSTED runner. That pin predates both the fingerprint theory AND its
# overturn -- the working curl was run from the owner's own Mac/network, and that exact
# configuration (self-hosted, this network) has never been tried from `ubuntu-latest`. memory/
# dispatch-83.md's Q2 scopes testing a hosted runner as a SEPARATE, later step: prove 200s here
# first, then change ONLY `runs-on` and re-test -- do not change both at once.
#
# ⚠️ Requires a self-hosted runner registered with the label below, always-on, installed as a
# service (./svc.sh install), on a machine that will not sleep (see memory/dispatch-65.md's
# macOS checklist). If no such runner is online, this job QUEUES rather than failing -- Sync
# Failure Watch (workflow_run-based) cannot see a queued job, which is why
# src/engine/stream-freshness.js's per-stream freshness check is the thing that actually
# catches a dead/offline runner here, not this file.
#
# NOT live-verified from the session that wrote this rebuild -- no QSRSoft credentials or network
# access in that sandbox. buildUrl/buildBody/extractRows/dateList are still unit-tested unmodified
# (src/__tests__/qsrsoft-security-events-pull.test.js, all 10 pass); parseSecurityEventRow was
# already unit-tested before this dispatch (src/__tests__/security-events.test.js). The live Node
# fetch path itself has NEVER been run against the real API from this workflow. Before trusting
# any scheduled run's output, the owner must run this once via workflow_dispatch and confirm a
# real 200 + row count -- see memory/dispatch-83.md's Resolution section for the exact steps,
# including the open Q1 (minimal header set) / Q2 (hosted runner) / Q3 (was it always just token
# expiry?) questions this rebuild leaves for a live run to answer, one variable at a time.

on:
  schedule:
    # Once daily, matching the existing pulls' cadence -- 10:00 UTC alongside the DAR/eBOS pulls.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Max days of history on initial run (default: 14)'
        required: false
        default: '14'
      days_recent:
        description: 'Rolling re-pull window in days (default: 2)'
        required: false
        default: '2'
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Set with end_date to pull an explicit window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'

jobs:
  pull:
    runs-on: [self-hosted, macOS, qsr-security]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull QSRSoft Security Events data
        run: node scripts/qsrsoft-security-events-pull.mjs
        env:
          VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_USERNAME:                ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:                ${{ secrets.QSRSOFT_PASSWORD }}
          QSRSOFT_SECEVENTS_DAYS_BACK:     ${{ github.event.inputs.days_back   || '14' }}
          QSRSOFT_SECEVENTS_DAYS_RECENT:   ${{ github.event.inputs.days_recent || '2'  }}
          QSRSOFT_SECEVENTS_START_DATE:    ${{ github.event.inputs.start_date  || ''   }}
          QSRSOFT_SECEVENTS_END_DATE:      ${{ github.event.inputs.end_date    || ''   }}
          QSRSOFT_SECEVENTS_DEBUG:         ${{ github.event.inputs.debug       || '0'  }}
