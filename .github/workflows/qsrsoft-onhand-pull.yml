name: QSRSoft On-Hand Pull (EOM count-progress)

# Every 30 minutes (dispatch #210, tightened from hourly), but the script itself skips
# unless we're in the last 3 days of the month AND it's 8am-6pm CT (GitHub cron can't
# express "every 30 min only within a hard date+hour gate" directly, so this uses two
# top-of-hour/half-hour cron lines and leaves the actual gating to the script's own
# inCountWindow()/inCtBusinessHours() — see scripts/lib/count-window.mjs). During the
# count window this gives ~30-min snapshots so we can see when each store finishes
# counting; NOT tightened to 15 min — that would double exposure to GitHub's documented
# silent-scheduled-run-drop behavior (see scheduled-pull-watchdog.yml, added the same
# dispatch as a backstop for exactly that failure mode) for only marginal freshness gain.
# Manual runs can force any time via the `force` input.

on:
  schedule:
    - cron: '0 * * * *'    # :00 every hour (UTC); in-script window gate does the filtering
    - cron: '30 * * * *'   # :30 every hour (UTC) — the other half of the 30-min cadence
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the last-3-days window (1 = on)'
        required: false
        default: '1'
      period:
        description: 'Override period being counted (YYYY-MM, default: current month)'
        required: false
        default: ''
      date:
        description: 'Override the business date queried (YYYY-MM-DD, default: today UTC) -- ONHAND_DATE was already read by the script but had no workflow_dispatch input to set it'
        required: false
        default: ''
      debug:
        description: 'Verbose logging (1 = on)'
        required: false
        default: '0'
      dump_raw_fields:
        description: '#357-B2/3 — log the On-Hand API raw field set + one record once (1 = on)'
        required: false
        default: '0'

# Queue, don't cancel (dispatch #210) — every write in qsrsoft-onhand-pull.mjs is an
# idempotent upsert on a stable PK, so a queued run is harmless; a CANCELLED mid-write
# run is worse than a queued one. Matters more now that the 30-min cadence makes a
# still-running prior invocation (real runs measured ~130-142s, well under 30 min, but
# not zero-risk) more likely to overlap the next scheduled trigger.
concurrency:
  group: qsrsoft-onhand-pull-${{ github.ref }}
  cancel-in-progress: false

# actions:write (dispatch #210 Task 4) -- lets the script nudge QSRSoft FOB Pull
# (qsrsoft-pull.yml) via workflow_dispatch the instant a store crosses "believes done"
# on its count, instead of waiting for that pull's own 3x/day schedule. workflow_dispatch
# is one of the two events (repository_dispatch is the other) GitHub explicitly exempts
# from the default GITHUB_TOKEN's "won't trigger further workflow runs" restriction, so
# no separate PAT is needed.
permissions:
  contents: read
  actions: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Pull QSRSoft On-Hand Inventory
        run: node scripts/qsrsoft-onhand-pull.mjs
        env:
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QSRSOFT_EBOS_TOKEN:        ${{ secrets.QSRSOFT_EBOS_TOKEN }}
          QSRSOFT_TOKEN:             ${{ secrets.QSRSOFT_TOKEN }}
          QSRSOFT_USERNAME:          ${{ secrets.QSRSOFT_USERNAME }}
          QSRSOFT_PASSWORD:          ${{ secrets.QSRSOFT_PASSWORD }}
          ONHAND_FORCE:              ${{ github.event.inputs.force  || '0' }}
          ONHAND_PERIOD:             ${{ github.event.inputs.period || ''  }}
          ONHAND_DATE:               ${{ github.event.inputs.date   || ''  }}
          QSRSOFT_DEBUG:             ${{ github.event.inputs.debug  || '0' }}
          DUMP_RAW_FIELDS:           ${{ github.event.inputs.dump_raw_fields || '0' }}
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onhand-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
